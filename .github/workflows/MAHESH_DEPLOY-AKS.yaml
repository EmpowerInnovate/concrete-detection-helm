name: Mahesh-AKS-deploy crack detection

# Triggered manually from the GitHub Actions tab.
# Deploys the crack-detection app to an AKS cluster created by the
# "Deploy Kubernetes Cluster" workflow in concrete-detection-infra.
# The app is exposed through an ingress-nginx controller whose public IP gets a free
# Azure DNS name: <dns_label>.<region>.cloudapp.azure.com. The bare IP keeps serving HTTP.
#
# SSL (tls_mode):
#   letsencrypt         - cert-manager + Let's Encrypt (trusted by all browsers, auto-renewed)
#   letsencrypt-staging - same, against Let's Encrypt's staging CA (untrusted cert, no rate
#                         limits) - use it to test issuance before switching to letsencrypt
#   mkcert              - certificate generated locally with mkcert, read from the repository
#                         secrets AKS_TLS_CERT / AKS_TLS_KEY (PEM). Trusted only on machines
#                         that have the mkcert root CA installed
#   none                - HTTP only
# The optional repository secret LETSENCRYPT_EMAIL registers the ACME account with an email.
#
# Images: by default this workflow builds all three images from this commit and
# pushes them to Docker Hub under a dedicated AKS tag series (aks-1.0.N, plus
# aks-latest), then deploys exactly that tag. The aks- prefix keeps these builds
# separate from the 1.x.y tags published by the generic build workflow (used by GKE/DO).
#
# Credentials: if azure_client_id / azure_client_secret are left blank, the
# repository secrets AZURE_CLIENT_ID / AZURE_CLIENT_SECRET are used instead.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = install/upgrade the app | uninstall = remove the app, ingress controller and cert-manager"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - uninstall
      azure_subscription_id:
        description: "[Azure] Subscription ID"
        required: true
        type: string
      azure_tenant_id:
        description: "[Azure] Tenant ID (Directory ID)"
        required: true
        type: string
      azure_client_id:
        description: "[Azure] Service Principal Client ID (leave blank to use secrets.AZURE_CLIENT_ID)"
        required: false
        type: string
      azure_client_secret:
        description: "[Azure] Service Principal Client Secret (leave blank to use secrets.AZURE_CLIENT_SECRET)"
        required: false
        type: string
      aks_cluster_name:
        description: "[Azure] AKS cluster name"
        required: true
        default: "crack-detection-cluster"
        type: string
      aks_resource_group:
        description: "[Azure] AKS resource group (leave blank for '<cluster_name>-rg')"
        required: false
        type: string
      build_images:
        description: "Build and push new AKS images (aks-1.0.N) from this commit and deploy them. Uncheck to deploy an existing tag instead."
        required: true
        default: true
        type: boolean
      image_tag:
        description: 'Used only when build_images is unchecked: tag to deploy ("auto" = latest aks-1.x.y tag, or an explicit tag e.g. aks-1.0.3)'
        required: true
        default: "auto"
        type: string
      dns_label:
        description: "[Azure] DNS label for the ingress IP -> <label>.<region>.cloudapp.azure.com (unique per region)"
        required: true
        default: "crack-detection-mahesh"
        type: string
      tls_mode:
        description: "SSL certificate source"
        required: true
        default: "letsencrypt"
        type: choice
        options:
          - letsencrypt
          - letsencrypt-staging
          - mkcert
          - none

jobs:
  AKS-deploy-concrete-detection:
    name: AKS-deploy-concrete-detection
    runs-on: ubuntu-latest
    env:
      TLS_MODE: ${{ github.event.inputs.tls_mode }}
      TLS_SECRET: concrete-gallery-tls

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Print input parameters
      run: |
        echo "================================================"
        echo "  Pipeline Input Parameters"
        echo "================================================"
        echo "  action               : ${{ github.event.inputs.action }}"
        echo "  azure_subscription_id: ${{ github.event.inputs.azure_subscription_id }}"
        echo "  azure_tenant_id      : ${{ github.event.inputs.azure_tenant_id }}"
        echo "  azure_client_id      : ${{ github.event.inputs.azure_client_id != '' && 'provided' || 'NOT provided (using secrets)' }}"
        echo "  azure_client_secret  : ${{ github.event.inputs.azure_client_secret != '' && 'provided' || 'NOT provided (using secrets)' }}"
        echo "  aks_cluster_name     : ${{ github.event.inputs.aks_cluster_name }}"
        echo "  aks_resource_group   : ${{ github.event.inputs.aks_resource_group }}"
        echo "  build_images         : ${{ github.event.inputs.build_images }}"
        echo "  image_tag            : ${{ github.event.inputs.image_tag }}"
        echo "  dns_label            : ${{ github.event.inputs.dns_label }}"
        echo "  tls_mode             : ${{ github.event.inputs.tls_mode }}"
        echo "================================================"

    - name: Log in to DockerHub
      if: ${{ github.event.inputs.action == 'deploy' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.MAHESH_DOCKER_USERNAME }}
        password: ${{ secrets.MAHESH_DOCKER_PASSWORD }}

    - name: Resolve Docker Image Tag
      if: ${{ github.event.inputs.action == 'deploy' }}
      id: resolve_tag
      run: |
        REPO="${{ secrets.MAHESH_DOCKER_USERNAME }}/image-upload-logic"
        TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull" | jq -r .token)
        TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://registry-1.docker.io/v2/${REPO}/tags/list" | jq -r '.tags[]' 2>/dev/null || true)
        LATEST_AKS=$(echo "$TAGS" | grep -E '^aks-1\.[0-9]+\.[0-9]+$' | sed 's/^aks-//' | sort -V | tail -n 1 || true)

        if [[ "${{ github.event.inputs.build_images }}" == "true" ]]; then
          if [[ -z "$LATEST_AKS" ]]; then
            NEXT="1.0.1"
          else
            IFS='.' read -r major minor patch <<< "$LATEST_AKS"
            NEXT="${major}.${minor}.$((patch + 1))"
          fi
          TAG="aks-${NEXT}"
          echo "New AKS build tag: $TAG"
        else
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [[ "$INPUT_TAG" == "latest" || "$INPUT_TAG" == "auto" || -z "$INPUT_TAG" ]]; then
            if [[ -z "$LATEST_AKS" ]]; then
              echo "::error::No aks-1.x.y images found on Docker Hub. Run with build_images checked first."
              exit 1
            fi
            TAG="aks-${LATEST_AKS}"
            echo "Resolved latest AKS tag: $TAG"
          else
            TAG="$INPUT_TAG"
            echo "Using specified tag: $TAG"
          fi
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      if: ${{ github.event.inputs.action == 'deploy' && github.event.inputs.build_images == 'true' }}
      uses: docker/setup-buildx-action@v3

    - name: Build and push AKS images
      if: ${{ github.event.inputs.action == 'deploy' && github.event.inputs.build_images == 'true' }}
      env:
        REGISTRY: ${{ secrets.MAHESH_DOCKER_USERNAME }}
        TAG: ${{ steps.resolve_tag.outputs.tag }}
      run: |
        build_push() {
          local dir="$1" image="$2"
          echo "Building $REGISTRY/$image:$TAG from buildConcreteDetection/$dir ..."
          docker build -f "buildConcreteDetection/$dir/dockerfile" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$REGISTRY/$image:$TAG" \
            -t "$REGISTRY/$image:aks-latest" \
            "buildConcreteDetection/$dir"
          docker push "$REGISTRY/$image:$TAG"
          docker push "$REGISTRY/$image:aks-latest"
        }
        build_push imageUpload          image-upload-logic
        build_push crackDetection       crack-detection-logic
        build_push concreteImageGallery concrete-image-gallery-logic
        echo "Pushed AKS images with tag $TAG (commit $GITHUB_SHA)"

    - name: Verify Docker images exist
      if: ${{ github.event.inputs.action == 'deploy' }}
      run: |
        docker manifest inspect ${{ secrets.MAHESH_DOCKER_USERNAME }}/image-upload-logic:${{ steps.resolve_tag.outputs.tag }} > /dev/null
        docker manifest inspect ${{ secrets.MAHESH_DOCKER_USERNAME }}/crack-detection-logic:${{ steps.resolve_tag.outputs.tag }} > /dev/null
        docker manifest inspect ${{ secrets.MAHESH_DOCKER_USERNAME }}/concrete-image-gallery-logic:${{ steps.resolve_tag.outputs.tag }} > /dev/null

    - name: Authenticate to Azure
      env:
        INPUT_CLIENT_ID: ${{ github.event.inputs.azure_client_id }}
        INPUT_CLIENT_SECRET: ${{ github.event.inputs.azure_client_secret }}
        SECRET_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        SECRET_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        TENANT_ID: ${{ github.event.inputs.azure_tenant_id }}
        SUBSCRIPTION_ID: ${{ github.event.inputs.azure_subscription_id }}
      run: |
        CLIENT_ID="${INPUT_CLIENT_ID:-$SECRET_CLIENT_ID}"
        CLIENT_SECRET="${INPUT_CLIENT_SECRET:-$SECRET_CLIENT_SECRET}"
        echo "::add-mask::$CLIENT_SECRET"
        if [[ -z "$CLIENT_ID" || -z "$CLIENT_SECRET" ]]; then
          echo "::error::Azure client ID/secret missing: provide them as inputs or set secrets AZURE_CLIENT_ID / AZURE_CLIENT_SECRET"
          exit 1
        fi
        az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID" --output none
        az account set --subscription "$SUBSCRIPTION_ID"
        echo "Azure CLI authenticated for subscription: $SUBSCRIPTION_ID"

    - name: Configure kubectl for AKS
      id: aks
      env:
        DNS_LABEL: ${{ github.event.inputs.dns_label }}
      run: |
        CLUSTER_NAME="${{ github.event.inputs.aks_cluster_name }}"
        RG="${{ github.event.inputs.aks_resource_group }}"
        if [[ -z "$RG" ]]; then
          RG="${CLUSTER_NAME}-rg"
        fi
        echo "Fetching credentials for AKS cluster '$CLUSTER_NAME' in resource group '$RG'..."
        az aks get-credentials --resource-group "$RG" --name "$CLUSTER_NAME" --overwrite-existing --admin
        kubectl get nodes

        # Azure DNS labels: 3-63 chars, lowercase letters/digits/hyphens, start with a letter.
        if [[ ! "$DNS_LABEL" =~ ^[a-z][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
          echo "::error::Invalid dns_label '$DNS_LABEL' (use 3-63 lowercase letters, digits or hyphens, starting with a letter)"
          exit 1
        fi
        LOCATION=$(az aks show --resource-group "$RG" --name "$CLUSTER_NAME" --query location -o tsv)
        FQDN="${DNS_LABEL}.${LOCATION}.cloudapp.azure.com"
        echo "App domain: $FQDN"
        echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Ensure NGINX Ingress Controller is installed (AKS)
      if: ${{ github.event.inputs.action == 'deploy' }}
      id: ingress
      env:
        DNS_LABEL: ${{ github.event.inputs.dns_label }}
        FQDN: ${{ steps.aks.outputs.fqdn }}
      run: |
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo update
        # Azure Load Balancer health probes must hit /healthz, otherwise the LB marks nodes unhealthy.
        # azure-dns-label-name makes Azure publish <label>.<region>.cloudapp.azure.com for the LB IP.
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --namespace ingress-nginx --create-namespace \
          --set controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"=/healthz \
          --set-string controller.service.annotations."service\.beta\.kubernetes\.io/azure-dns-label-name"="$DNS_LABEL" \
          --set controller.service.externalTrafficPolicy=Local \
          --wait --timeout 10m
        kubectl get svc ingress-nginx-controller -n ingress-nginx

        IP=""
        for i in {1..60}; do
          IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          [[ -n "$IP" ]] && break
          echo "Waiting for LoadBalancer IP... (attempt $i/60)"
          sleep 5
        done
        if [[ -z "$IP" ]]; then
          echo "::error::Failed to retrieve ingress public IP"
          kubectl get svc -n ingress-nginx || true
          exit 1
        fi
        echo "Ingress public IP: $IP"
        echo "ip=$IP" >> "$GITHUB_OUTPUT"

        # Let's Encrypt validates over this name, so it must resolve before the certificate is requested.
        for i in {1..60}; do
          RESOLVED=$(dig +short "$FQDN" @1.1.1.1 | tail -n 1)
          if [[ "$RESOLVED" == "$IP" ]]; then
            echo "DNS ready: $FQDN -> $IP"
            exit 0
          fi
          echo "Waiting for $FQDN to resolve to $IP (got '${RESOLVED:-nothing}')... (attempt $i/60)"
          sleep 10
        done
        echo "::error::$FQDN does not resolve to $IP. The DNS label may already be taken in this region - try another dns_label."
        kubectl describe svc ingress-nginx-controller -n ingress-nginx | sed -n '/Events:/,$p' || true
        exit 1

    - name: Install cert-manager and Let's Encrypt issuers
      if: ${{ github.event.inputs.action == 'deploy' && startsWith(github.event.inputs.tls_mode, 'letsencrypt') }}
      env:
        ACME_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      run: |
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager --create-namespace \
          --set crds.enabled=true \
          --wait --timeout 10m

        issuer() {
          local name="$1" server="$2"
          cat <<YAML
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: ${name}
        spec:
          acme:
            server: ${server}
        ${ACME_EMAIL:+    email: ${ACME_EMAIL}}
            privateKeySecretRef:
              name: ${name}-account-key
            solvers:
              - http01:
                  ingress:
                    ingressClassName: nginx
        ---
        YAML
        }
        {
          issuer letsencrypt-prod    https://acme-v02.api.letsencrypt.org/directory
          issuer letsencrypt-staging https://acme-staging-v02.api.letsencrypt.org/directory
        } > issuers.yaml
        cat issuers.yaml

        # The cert-manager webhook can take a few seconds to accept requests after install.
        for i in {1..12}; do
          kubectl apply -f issuers.yaml && break
          echo "cert-manager webhook not ready yet, retrying... (attempt $i/12)"
          sleep 10
        done
        kubectl wait --for=condition=Ready clusterissuer/letsencrypt-prod clusterissuer/letsencrypt-staging --timeout=120s

    - name: Create TLS secret from mkcert certificate
      if: ${{ github.event.inputs.action == 'deploy' && github.event.inputs.tls_mode == 'mkcert' }}
      env:
        TLS_CERT: ${{ secrets.AKS_TLS_CERT }}
        TLS_KEY: ${{ secrets.AKS_TLS_KEY }}
        FQDN: ${{ steps.aks.outputs.fqdn }}
      run: |
        if [[ -z "$TLS_CERT" || -z "$TLS_KEY" ]]; then
          echo "::error::tls_mode=mkcert needs repository secrets AKS_TLS_CERT and AKS_TLS_KEY (PEM contents of: mkcert $FQDN)"
          exit 1
        fi
        printf '%s\n' "$TLS_CERT" > tls.crt
        printf '%s\n' "$TLS_KEY" > tls.key
        openssl x509 -in tls.crt -noout -subject -enddate
        if ! openssl x509 -in tls.crt -noout -checkhost "$FQDN" | grep -q "does match"; then
          echo "::warning::The mkcert certificate does not cover $FQDN - regenerate it with: mkcert $FQDN"
        fi
        # Drop any cert-manager Certificate left from a previous letsencrypt run so it cannot overwrite this secret.
        kubectl delete certificate "$TLS_SECRET" --ignore-not-found=true 2>/dev/null || true
        kubectl create secret tls "$TLS_SECRET" --cert=tls.crt --key=tls.key --dry-run=client -o yaml | kubectl apply -f -
        rm -f tls.crt tls.key

    - name: Deploy Application using Helm on AKS
      if: ${{ github.event.inputs.action == 'deploy' }}
      env:
        FQDN: ${{ steps.aks.outputs.fqdn }}
      run: |
        helm upgrade --install nfs-server ./nfsserverChart
        kubectl rollout status deployment nfs-server-depl --timeout=180s
        NFS_CIP=$(kubectl get svc nfs-server-svc-cip -o jsonpath='{.spec.clusterIP}')
        if [[ -z "$NFS_CIP" ]]; then
          echo "ERROR: could not discover nfs-server-svc-cip ClusterIP" >&2
          exit 1
        fi
        echo "NFS ClusterIP: $NFS_CIP"

        TLS_ARGS=()
        if [[ "$TLS_MODE" != "none" ]]; then
          # hosts[1] is empty: a host-less rule keeps the app reachable over HTTP on the bare IP.
          TLS_ARGS+=(--set "global.ingress.hosts[0]=$FQDN" --set "global.ingress.hosts[1]="
                     --set global.ingress.tls.enabled=true --set "global.ingress.tls.secretName=$TLS_SECRET")
          case "$TLS_MODE" in
            letsencrypt)         TLS_ARGS+=(--set global.ingress.tls.clusterIssuer=letsencrypt-prod) ;;
            letsencrypt-staging) TLS_ARGS+=(--set global.ingress.tls.clusterIssuer=letsencrypt-staging) ;;
          esac
        else
          kubectl delete certificate "$TLS_SECRET" --ignore-not-found=true 2>/dev/null || true
        fi

        helm upgrade --install master-chart ./masterChart \
          -f ./masterChart/values-azure.yaml \
          "${TLS_ARGS[@]}" \
          --set pv-chart.nfsCIP="$NFS_CIP" \
          --set global.registry="${{ secrets.MAHESH_DOCKER_USERNAME }}" \
          --set global.imageUploadImage="image-upload-logic:${{ steps.resolve_tag.outputs.tag }}" \
          --set global.crackDetectionImage="crack-detection-logic:${{ steps.resolve_tag.outputs.tag }}" \
          --set global.concreteGalleryImage="concrete-image-gallery-logic:${{ steps.resolve_tag.outputs.tag }}"
        for d in image-upload-depl crack-detection-depl concrete-image-gallery-depl; do
          kubectl rollout status deployment "$d" --timeout=300s || {
            echo "::warning::Deployment $d did not become ready in time"
            kubectl describe deployment "$d" | tail -20 || true
            kubectl get pods -o wide || true
          }
        done

    - name: Wait for Let's Encrypt certificate
      if: ${{ github.event.inputs.action == 'deploy' && startsWith(github.event.inputs.tls_mode, 'letsencrypt') }}
      run: |
        # cert-manager creates the Certificate from the ingress annotation a few seconds after deploy.
        for i in {1..30}; do
          kubectl get certificate "$TLS_SECRET" >/dev/null 2>&1 && break
          sleep 2
        done
        if ! kubectl wait --for=condition=Ready "certificate/$TLS_SECRET" --timeout=10m; then
          echo "::error::Certificate was not issued. cert-manager diagnostics:"
          kubectl describe certificate "$TLS_SECRET" || true
          kubectl get certificaterequest,order,challenge -A || true
          kubectl describe challenge -A || true
          exit 1
        fi
        kubectl get certificate "$TLS_SECRET"

    - name: Verify and summarize deployment
      if: ${{ github.event.inputs.action == 'deploy' }}
      env:
        IP: ${{ steps.ingress.outputs.ip }}
        FQDN: ${{ steps.aks.outputs.fqdn }}
        TAG: ${{ steps.resolve_tag.outputs.tag }}
      run: |
        if [[ "$TLS_MODE" == "none" ]]; then
          BASE="http://$FQDN"
        else
          BASE="https://$FQDN"
          if [[ "$TLS_MODE" == "letsencrypt" ]]; then
            # Real certificate: the HTTPS request must pass normal certificate verification.
            # ingress-nginx needs a little time to pick up the freshly issued secret (it serves its
            # self-signed default cert until then), so poll. --resolve pins the name to the ingress IP
            # so the runner's DNS cache cannot interfere.
            OK=""
            for i in {1..36}; do
              if ERR=$(curl -sS -o /dev/null --max-time 15 --resolve "$FQDN:443:$IP" "$BASE/" 2>&1); then
                OK=1
                break
              fi
              echo "HTTPS not ready yet (attempt $i/36): $ERR"
              sleep 5
            done
            if [[ -z "$OK" ]]; then
              echo "::error::HTTPS check against $BASE failed: $ERR"
              exit 1
            fi
            echo "HTTPS verified with a trusted certificate."
          else
            echo "::notice::$TLS_MODE certificate is not publicly trusted - browsers without the matching root CA will warn."
          fi
          echo "Served certificate:"
          echo | openssl s_client -connect "$IP:443" -servername "$FQDN" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate || true
        fi
        echo "================================================"
        echo "Deployment Successful on AKS!"
        echo "  External IP : $IP"
        echo "  Domain      : $FQDN"
        echo "  TLS mode    : $TLS_MODE"
        echo "  Image tag   : $TAG"
        echo "  Gallery URL : $BASE/"
        echo "  Upload URL  : $BASE/upload"
        echo "  (plain IP)  : http://$IP/"
        echo "================================================"
        {
          echo "### Crack detection deployed to AKS"
          echo ""
          echo "- Gallery: $BASE/"
          echo "- Upload: $BASE/upload"
          echo "- Plain IP (HTTP): http://$IP/"
          echo "- TLS mode: \`$TLS_MODE\`"
          echo "- Image tag: \`$TAG\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Uninstall Application from AKS
      if: ${{ github.event.inputs.action == 'uninstall' }}
      run: |
        helm uninstall master-chart --wait || true
        helm uninstall nfs-server --wait || true
        helm uninstall ingress-nginx -n ingress-nginx --wait || true
        kubectl delete secret "$TLS_SECRET" --ignore-not-found=true || true
        kubectl delete clusterissuer letsencrypt-prod letsencrypt-staging --ignore-not-found=true 2>/dev/null || true
        helm uninstall cert-manager -n cert-manager --wait || true
        kubectl delete pv concrete-images-pv-nfs mypvc --ignore-not-found=true || true
        echo "Remaining resources:"
        kubectl get all -A | grep -v kube-system || true
