apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      role: nfs-server
  template:
    metadata:
      labels:
        role: nfs-server
    spec:
      containers:
      - name: nfs-server
        image: itsthenetwork/nfs-server-alpine:latest  # ✅ Use modern image
        ports:
          - name: nfs
            containerPort: 2049
          - name: mountd
            containerPort: 20048
          - name: rpcbind
            containerPort: 111
        securityContext:
          privileged: true
        env:
          - name: SHARED_DIRECTORY
            value: "/export"                           # ✅ Use /export, not /exports
        volumeMounts:
          - mountPath: /export                         # ✅ Match the SHARED_DIRECTORY
            name: mypvc
      volumes:
        - name: mypvc
          emptyDir: {}                                 # ✅ Use emptyDir for simplicity










