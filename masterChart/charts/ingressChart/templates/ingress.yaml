{{- if eq (default "gcp" .Values.global.provider) "azure" }}
{{- $ing := .Values.global.ingress | default dict }}
{{- $tls := $ing.tls | default dict }}
{{- $hosts := $ing.hosts | default (list "") }}
{{- $annotations := $ing.annotations | default dict }}
{{- if $tls.clusterIssuer }}
{{- $annotations = merge (dict "cert-manager.io/cluster-issuer" $tls.clusterIssuer) $annotations }}
{{- end }}
{{- if and $tls.enabled (not (compact $hosts)) }}
{{- fail "global.ingress.tls.enabled requires at least one entry in global.ingress.hosts" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concrete-gallery-ingress
  namespace: default
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ default "nginx" $ing.className | quote }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        {{- range compact $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default "concrete-gallery-tls" $tls.secretName | quote }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concrete-image-gallery-svc-lb
                port:
                  number: 8082
          - path: /upload
            pathType: Prefix
            backend:
              service:
                name: image-upload-svc-lb
                port:
                  number: 8080
          - path: /uploaded
            pathType: Prefix
            backend:
              service:
                name: image-upload-svc-lb
                port:
                  number: 8080
      {{- with . }}
      host: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concrete-gallery-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "concrete-gallery-cert"
    kubernetes.io/ingress.global-static-ip-name: "concrete-detection-ip"
spec:
  ingressClassName: "gce"
  rules:
    # 1. AWS Route 53 Domain
    - host: mahesh.concretecrackgallery.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concrete-image-gallery-svc-lb
                port:
                  number: 8082
          - path: /upload
            pathType: Prefix
            backend:
              service:
                name: image-upload-svc-lb
                port:
                  number: 8080
          - path: /uploaded
            pathType: Prefix
            backend:
              service:
                name: image-upload-svc-lb
                port:
                  number: 8080

    # 2. GCP Domain
    - host: maheshconcretegallery.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concrete-image-gallery-svc-lb
                port:
                  number: 8082
          - path: /upload
            pathType: Prefix
            backend:
              service:
                name: image-upload-svc-lb
                port:
                  number: 8080
          - path: /uploaded
            pathType: Prefix
            backend:
              service:
                name: image-upload-svc-lb
                port:
                  number: 8080
{{- end }}
