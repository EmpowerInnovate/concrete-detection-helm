global:
  provider: gcp
  domainName: maheshconcretegallery.online
  domains:
    - maheshconcretegallery.online
    - mahesh.concretecrackgallery.online

  certName: concrete-gallery-cert
  staticIpName: concrete-detection-ip
  registry: "$MAHESH_DOCKER_USERNAME"
  imageUploadImage: image-upload-logic:latest
  crackDetectionImage: crack-detection-logic:latest
  concreteGalleryImage: concrete-image-gallery-logic:latest
  ingress:
    className: gce


concrete-image-gallery:
  labels:
    app: concrete-image-gallery-pod

crack-detection:
  labels:
    app: crack-detection-pod

image-upload:
  labels:
    app: image-upload-pod







